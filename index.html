<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Game</h1>
    <h2>Press any key to start the game</h2>
    <h3 class="hs">Your high score:0</h3>
    <div class="btn-container">
        <div class="first-line">
            <div class="btn yellow" type="button" id="yellow">1</div>
            <div class="btn red" type="button" id="red">2</div>
        </div>
        <div class="second-line">
            <div class="btn purple" type="button" id="purple">3</div>
            <div class="btn green" type="button" id="green">4</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
